services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finora
      POSTGRES_PASSWORD: finora_dev_password
      POSTGRES_DB: finora
    ports: ['5432:5432']
    volumes: ['finora-postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finora -d finora']
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: ['finora-redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  finora-postgres:
  finora-redis:
