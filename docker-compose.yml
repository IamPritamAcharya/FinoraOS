services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finora
      POSTGRES_PASSWORD: finora_dev_password
      POSTGRES_DB: finora
    ports: ['5432:5432']
    volumes: ['finora-postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finora -d finora']
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: ['finora-redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-finora_admin_dev}
      KC_HEALTH_ENABLED: 'true'
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=30
    ports: ['8080:8080']
    volumes:
      - './infra/keycloak/finora-realm.json:/opt/keycloak/data/import/finora-realm.json:ro'
      - 'finora-keycloak:/opt/keycloak/data'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
volumes:
  finora-postgres:
  finora-redis:
  finora-keycloak:
